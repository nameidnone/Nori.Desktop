[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11>=2.11.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nori-desktop"
version = "1.0.0"
description = "Nori Desktop Pet - Python Core with C++ Performance Modules"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Nori Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]
dependencies = [
    "PyQt6>=6.6.0",
    "PyQt6-WebEngine>=6.6.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
    "cryptography>=41.0.0",
    "keyring>=24.0.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",
    "httpx>=0.25.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
build = [
    "pybind11>=2.11.0",
    "cmake>=3.20.0",
    "ninja>=1.11.0",
]
package = [
    "nuitka>=2.0.0",
    "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/nori-desktop/nori"
Repository = "https://github.com/nori-desktop/nori.git"

[project.scripts]
nori = "nori_desktop.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nori_core*", "nori_desktop*"]

[tool.setuptools.package-data]
nori_desktop = ["assets/**/*", "wwwroot/**/*"]
nori_core = ["resources/**/*"]

[tool.cibuildwheel]
build = "cp312-* cp313-*"
skip = "*-win32 *-manylinux_i686"
before-build = "pip install pybind11 cmake ninja"

[tool.cibuildwheel.linux]
archs = "x86_64 aarch64"
environment = { CXX="g++", CC="gcc" }

[tool.cibuildwheel.macos]
archs = "x86_64 arm64"
environment = { CXX="clang++", CC="clang" }

[tool.cibuildwheel.windows]
archs = "AMD64"
environment = { CXX="cl.exe", CC="cl.exe" }

[tool.black]
line-length = 100
target-version = ["py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=nori_core --cov=nori_desktop --cov-report=term-missing"
